name: Frappe CRM - Build and Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_aws_deployment:
        description: "Confirm AWS deployment and associated costs"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Docker image
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm_aws_deployment == true }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./aws-deployment/docker
          file: ./aws-deployment/docker/Dockerfile
          push: false
          tags: frappe-crm:ci-validation

  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.confirm_aws_deployment == true }}

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Deployment intentionally gated
        run: |
          echo "AWS deployment requires an approved AWS budget and configured credentials."
          echo "No AWS deployment command is executed by this workflow yet."
