name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-scan:
    name: Dependency Vulnerability Scanning (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: false
          format: "table"
          severity: "CRITICAL,HIGH"

  container-scan:
    name: Container Image Security (Trivy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - "frappe/bench:latest"
          - "mariadb:10.8"
          - "redis:alpine"
    steps:
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: "table"
          severity: "CRITICAL,HIGH"

  iac-scan:
    name: Infrastructure as Code Scanning (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: kubernetes,dockerfile
          output_format: cli
          soft_fail: true
