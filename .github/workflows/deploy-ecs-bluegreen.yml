name: Deploy Frappe CRM to AWS ECS Fargate (Blue-Green)

on:
  push:
    branches:
      - task-gourobdas0103
      - main
    paths:
      - 'docker/**'
      - 'terraform/**'
      - 'crm/**'
      - 'frontend/**'
      - '.github/workflows/deploy-ecs-bluegreen.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'terraform/**'
      - 'crm/**'
  workflow_dispatch:
    inputs:
      deploy_to_aws:
        description: 'Deploy to AWS ECS Fargate via CodeDeploy'
        required: true
        type: boolean
        default: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'frappe-crm' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'frappe-crm-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'frappe-crm-service' }}
  CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION || 'frappe-crm-codedeploy-app' }}
  CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP || 'frappe-crm-dg' }}
  CONTAINER_NAME: "frappe-crm"

jobs:
  lint-and-validate:
    name: Lint & Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check

      - name: Validate AppSpec and Task Definition
        run: |
          test -f docker/appspec.yaml || (echo "appspec.yaml missing" && exit 1)
          test -f docker/task-definition.json || (echo "task-definition.json missing" && exit 1)
          jq . docker/task-definition.json > /dev/null

  build-and-push:
    name: Build & Push Image to AWS ECR
    needs: lint-and-validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Container Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Building Frappe CRM production Docker image..."
          docker build \
            --file docker/Dockerfile \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            .

          echo "Pushing images to Amazon ECR..."
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

  deploy-blue-green:
    name: Deploy to ECS Fargate via CodeDeploy
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_aws == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Active Task Definition from ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ env.CONTAINER_NAME }}" \
            --query taskDefinition > task-definition.json

      - name: Render New Task Definition with Updated Image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to Amazon ECS via CodeDeploy Blue-Green
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-app: ${{ env.CODEDEPLOY_APPLICATION }}
          codedeploy-deployment-group: ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }}

      - name: Post-Deployment Verification Summary
        if: always()
        run: |
          echo "### 🚀 Frappe CRM Blue-Green Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed Image:** \`${{ needs.build-and-push.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** \`${{ env.ECS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** \`${{ env.ECS_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeDeploy Application:** \`${{ env.CODEDEPLOY_APPLICATION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudWatch Alarms Rollback Guard:** Active" >> $GITHUB_STEP_SUMMARY
