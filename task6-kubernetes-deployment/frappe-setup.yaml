apiVersion: v1
kind: Pod
metadata:
  name: frappe-setup
  namespace: frappe
spec:
  securityContext:
    fsGroup: 0
  initContainers:
    - name: initialize-sites
      image: ghcr.io/shirisha-thakur/frappe-crm-kubernetes:v16
      imagePullPolicy: Always
      command: ["sh", "-c", "cp -an /home/frappe/frappe-bench/sites/. /mnt/sites/ && chown -R 1000:0 /mnt/sites"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: sites
          mountPath: /mnt/sites
  containers:
    - name: setup
      image: ghcr.io/shirisha-thakur/frappe-crm-kubernetes:v16
      imagePullPolicy: Always
      command: ["sleep", "3600"]
      volumeMounts:
        - name: sites
          mountPath: /home/frappe/frappe-bench/sites
  volumes:
    - name: sites
      persistentVolumeClaim:
        claimName: frappe-sites-pvc
