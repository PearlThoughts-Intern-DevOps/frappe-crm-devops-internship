apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe
  namespace: frappe-crm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frappe
  template:
    metadata:
      labels:
        app: frappe
    spec:
      containers:
        - name: frappe
          image: frappe/bench:latest
          command: ["bash", "/workspace/init.sh"]
          workingDir: /home/frappe
          ports:
            - containerPort: 8000
              name: web
          env:
            - name: SHELL
              value: /bin/bash
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-secrets
                  key: mariadb-root-password
            - name: FRAPPE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-secrets
                  key: frappe-admin-password
          volumeMounts:
            - name: frappe-init
              mountPath: /workspace
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: frappe-init
          configMap:
            name: frappe-init
---
apiVersion: v1
kind: Service
metadata:
  name: frappe
  namespace: frappe-crm
spec:
  type: LoadBalancer
  selector:
    app: frappe
  ports:
    - port: 80
      targetPort: 8000