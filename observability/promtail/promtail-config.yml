server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Ship Docker container stdout/stderr logs (frappe-crm, mariadb, redis, monitoring)
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - docker: {}

  # 2. Ship EC2 host system logs
  - job_name: ec2-system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: frappe-crm-ec2
          __path__: /var/log/{syslog,auth.log,cloud-init-output.log}
