global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: ec2-prod
    application: frappe-crm

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 2. EC2 Host OS & Hardware Metrics (CPU, Memory, Disk, Network)
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # 3. Docker Container Metrics (frappe-crm, mariadb, redis, monitoring stack)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # 4. MariaDB Metrics
  - job_name: mariadb
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # 5. Redis Metrics
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # 6. Loki Self-Metrics
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # 7. Frappe CRM HTTP Synthetic Uptime & Latency Checks (Blackbox Exporter)
  - job_name: frappe-crm-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frappe-crm:8000/api/method/frappe.ping
          - http://frappe-crm:8000/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
