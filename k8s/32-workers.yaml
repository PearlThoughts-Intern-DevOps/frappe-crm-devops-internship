# Background workers pull jobs off redis-queue (emails, imports, automations).
# They have no port and no Service: nobody calls them, they call Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-short
  namespace: frappe-crm
spec:
  replicas: 1
  selector:
    matchLabels: { app: queue-short }
  template:
    metadata:
      labels: { app: queue-short, app.kubernetes.io/part-of: frappe-crm }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 0 } # image user: frappe = uid 1000, group root
      containers:
        - name: worker
          image: frappe-crm:v15
          imagePullPolicy: Never # built locally + loaded into minikube (see README)
          args: ["bench", "worker", "--queue", "short,default"]
          volumeMounts:
            - { name: sites, mountPath: /home/frappe/frappe-bench/sites }
            - { name: logs, mountPath: /home/frappe/frappe-bench/logs }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: sites
          persistentVolumeClaim: { claimName: sites }
        - name: logs
          persistentVolumeClaim: { claimName: logs }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-long
  namespace: frappe-crm
spec:
  replicas: 1
  selector:
    matchLabels: { app: queue-long }
  template:
    metadata:
      labels: { app: queue-long, app.kubernetes.io/part-of: frappe-crm }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 0 } # image user: frappe = uid 1000, group root
      containers:
        - name: worker
          image: frappe-crm:v15
          imagePullPolicy: Never # built locally + loaded into minikube (see README)
          args: ["bench", "worker", "--queue", "long,default,short"]
          volumeMounts:
            - { name: sites, mountPath: /home/frappe/frappe-bench/sites }
            - { name: logs, mountPath: /home/frappe/frappe-bench/logs }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: sites
          persistentVolumeClaim: { claimName: sites }
        - name: logs
          persistentVolumeClaim: { claimName: logs }
