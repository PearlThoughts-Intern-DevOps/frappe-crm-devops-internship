# TROUBLESHOOTING PRACTICE: three pods that fail in three classic ways.
#   kubectl apply -f k8s/labs/broken-pods.yaml
#   kubectl get pods -n frappe-crm -l lab=broken -w
# Diagnose each with `kubectl describe pod` and `kubectl logs`. Answers are in k8s/README.md.
# Clean up: kubectl delete -f k8s/labs/broken-pods.yaml
apiVersion: v1
kind: Pod
metadata:
  name: lab-typo-image
  namespace: frappe-crm
  labels: { lab: broken }
spec:
  containers:
    - name: app
      image: redis:this-tag-does-not-exist
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-crashing
  namespace: frappe-crm
  labels: { lab: broken }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo connecting to mariadb...; sleep 3; echo FATAL wrong password >&2; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-too-hungry
  namespace: frappe-crm
  labels: { lab: broken }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { memory: 64Gi } # more RAM than the Minikube node has
