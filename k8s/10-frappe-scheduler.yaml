apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-scheduler
  namespace: frappe-crm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frappe-scheduler
  template:
    metadata:
      labels:
        app: frappe-scheduler
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/frappe/crm:stable
          command:
            - bench
            - schedule
          envFrom:
            - configMapRef:
                name: frappe-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: sites-storage
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites-storage
          persistentVolumeClaim:
            claimName: frappe-sites-pvc