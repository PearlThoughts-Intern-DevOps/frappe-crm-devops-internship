apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frappe-crm-ingress
  namespace: frappe-crm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: crm.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frappe-web-svc
                port:
                  number: 80