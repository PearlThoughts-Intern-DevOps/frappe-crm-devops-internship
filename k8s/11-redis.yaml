# Two separate Redis instances, like production Frappe:
#   redis-cache -> cache + sessions (losing it is harmless)
#   redis-queue -> background job queue + socket.io pub/sub
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: frappe-crm
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-cache }
  template:
    metadata:
      labels: { app: redis-cache, app.kubernetes.io/part-of: frappe-crm }
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: frappe-crm
spec:
  selector: { app: redis-cache }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-queue
  namespace: frappe-crm
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-queue }
  template:
    metadata:
      labels: { app: redis-queue, app.kubernetes.io/part-of: frappe-crm }
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue
  namespace: frappe-crm
spec:
  selector: { app: redis-queue }
  ports: [{ port: 6379, targetPort: 6379 }]
