apiVersion: v1
kind: ConfigMap
metadata:
  name: frappe-config
  namespace: frappe-crm
data:
  FRAPPE_SITE_NAME: "crm.localhost"
  DB_HOST: "mariadb-svc"
  DB_PORT: "3306"
  REDIS_CACHE_URL: "redis://redis-cache-svc:6379"
  REDIS_QUEUE_URL: "redis://redis-queue-svc:6379"
  REDIS_SOCKETIO_URL: "redis://redis-socketio-svc:6379"
  SOCKETIO_PORT: "9000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-config
  namespace: frappe-crm
data:
  frappe.cnf: |
    [mysqld]
    character-set-client-handshake = FALSE
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci
    innodb_file_per_table = 1
    innodb_large_prefix = 1
    innodb_file_format = Barracuda
    innodb_buffer_pool_size = 512M
    max_allowed_packet = 256M

    [mysql]
    default-character-set = utf8mb4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: frappe-crm
data:
  default.conf: |
    upstream frappe-gunicorn {
        server 127.0.0.1:8000 fail_timeout=0;
    }

    upstream frappe-socketio {
        server frappe-socketio-svc:9000 fail_timeout=0;
    }

    server {
        listen 8080;
        server_name crm.localhost _;
        root /home/frappe/frappe-bench/sites;

        client_max_body_size 50m;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Serve compiled JS/CSS/font bundles directly from shared PVC
        location /assets {
            try_files $uri =404;
            add_header Cache-Control "max-age=31536000";
        }

        # Serve public site files
        location ~ ^/files/(.*)$ {
            try_files /crm.localhost/public/files/$1 @webserver;
        }

        # Route real-time WebSocket connections to dedicated Socket.IO deployment
        location /socket.io {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Frappe-Site-Name crm.localhost;
            proxy_set_header Origin $scheme://$http_host;
            proxy_set_header Host $host;
            proxy_pass http://frappe-socketio;
        }

        location / {
            try_files /crm.localhost/public/$uri @webserver;
        }

        location @webserver {
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Frappe-Site-Name crm.localhost;
            proxy_set_header Host $host;
            proxy_set_header X-Use-X-Accel-Redirect True;
            proxy_read_timeout 120;
            proxy_redirect off;
            proxy_pass http://frappe-gunicorn;
        }
    }