apiVersion: batch/v1
kind: Job
metadata:
  name: frappe-site-init
  namespace: frappe-crm
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: frappe-site-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MariaDB and Redis services..."
              until nc -z mariadb-svc 3306 && nc -z redis-cache-svc 6379 && nc -z redis-queue-svc 6379; do
                echo "Backing services not ready yet; sleeping 3s..."
                sleep 3
              done
              echo "All backing services are reachable!"
        - name: seed-sites-volume
          image: ghcr.io/frappe/crm:stable
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              echo "Seeding initial assets and apps.txt into shared PVC..."
              mkdir -p /mnt/sites/assets
              cp -rnL /home/frappe/frappe-bench/assets/* /mnt/sites/assets/ 2>/dev/null || true
              cp -rnL /home/frappe/frappe-bench/sites/assets/* /mnt/sites/assets/ 2>/dev/null || true
              cp -n /home/frappe/frappe-bench/sites/apps.txt /mnt/sites/apps.txt 2>/dev/null || true
              chown -R 1000:1000 /mnt/sites
          volumeMounts:
            - name: sites-storage
              mountPath: /mnt/sites
      containers:
        - name: create-site
          image: ghcr.io/frappe/crm:stable
          command:
            - bash
            - -c
            - |
              set -e
              cd /home/frappe/frappe-bench

              cat <<EOF > sites/common_site_config.json
              {
                "db_host": "${DB_HOST}",
                "db_port": ${DB_PORT},
                "redis_cache": "${REDIS_CACHE_URL}",
                "redis_queue": "${REDIS_QUEUE_URL}",
                "redis_socketio": "${REDIS_SOCKETIO_URL}",
                "socketio_port": ${SOCKETIO_PORT},
                "default_site": "${FRAPPE_SITE_NAME}"
              }
              EOF

              if [ ! -f "sites/${FRAPPE_SITE_NAME}/site_config.json" ]; then
                echo "Creating new Frappe CRM site: ${FRAPPE_SITE_NAME}..."
                bench new-site "${FRAPPE_SITE_NAME}" \
                  --mariadb-root-password "${MYSQL_ROOT_PASSWORD}" \
                  --admin-password "${ADMIN_PASSWORD}" \
                  --install-app crm \
                  --set-default

                # Ensure database user has wildcard host access across dynamic pod IPs
                DB_USER=$(python3 -c "import json; conf=json.load(open('sites/${FRAPPE_SITE_NAME}/site_config.json')); print(conf.get('db_name', ''))")
                DB_PASS=$(python3 -c "import json; conf=json.load(open('sites/${FRAPPE_SITE_NAME}/site_config.json')); print(conf.get('db_password', ''))")
                if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
                  echo "Granting wildcard host access to database user ${DB_USER}..."
                  mariadb -h "${DB_HOST}" -P "${DB_PORT}" -u root -p"${MYSQL_ROOT_PASSWORD}" -e "GRANT ALL PRIVILEGES ON \`${DB_USER}\`.* TO '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASS}'; FLUSH PRIVILEGES;" || true
                fi

                echo "Site ${FRAPPE_SITE_NAME} initialized!"
              else
                echo "Site ${FRAPPE_SITE_NAME} already exists. Running migrations..."
                bench --site "${FRAPPE_SITE_NAME}" migrate
              fi
          envFrom:
            - configMapRef:
                name: frappe-config
            - secretRef:
                name: frappe-secrets
          volumeMounts:
            - name: sites-storage
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites-storage
          persistentVolumeClaim:
            claimName: frappe-sites-pvc