apiVersion: v1
kind: Service
metadata:
  name: frappe-socketio-svc
  namespace: frappe-crm
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: socketio
  selector:
    app: frappe-socketio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-socketio
  namespace: frappe-crm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frappe-socketio
  template:
    metadata:
      labels:
        app: frappe-socketio
    spec:
      containers:
        - name: socketio
          image: ghcr.io/frappe/crm:stable
          command:
            - node
            - /home/frappe/frappe-bench/apps/frappe/socketio.js
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: frappe-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: sites-storage
              mountPath: /home/frappe/frappe-bench/sites
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: sites-storage
          persistentVolumeClaim:
            claimName: frappe-sites-pvc