apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data-pvc
  namespace: frappe-crm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frappe-sites-pvc
  namespace: frappe-crm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi