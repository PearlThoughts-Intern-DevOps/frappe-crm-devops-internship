apiVersion: v1
kind: Service
metadata:
  name: mariadb-svc
  namespace: frappe-crm
  labels:
    app: mariadb
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: frappe-crm
spec:
  serviceName: "mariadb-svc"
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.6
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frappe-secrets
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: mariadb-custom-config
              mountPath: /etc/mysql/conf.d/frappe.cnf
              subPath: frappe.cnf
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mariadb-admin ping -h 127.0.0.1 -u root --password=$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mariadb-admin ping -h 127.0.0.1 -u root --password=$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data-pvc
        - name: mariadb-custom-config
          configMap:
            name: mariadb-config