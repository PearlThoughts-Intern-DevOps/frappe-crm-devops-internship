# A Job is a pod that runs ONCE to completion (like a setup script).
# This one prepares the shared `sites` disk:
#   1. fix-permissions : make the fresh disk writable by the image's user (uid 1000, group 0)
#   2. configure       : write apps.txt + common_site_config.json (where are DB + Redis?)
#
# Note: we use `args:` (not `command:`) so the image's ENTRYPOINT still runs.
# That entrypoint links the image's built JS/CSS into sites/assets on every start.
apiVersion: batch/v1
kind: Job
metadata:
  name: configure
  namespace: frappe-crm
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app: configure, app.kubernetes.io/part-of: frappe-crm }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:0 /sites /logs && chmod -R g+rwX /sites /logs"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: sites, mountPath: /sites }
            - { name: logs, mountPath: /logs }
      containers:
        - name: configure
          image: frappe-crm:v15
          imagePullPolicy: Never # built locally + loaded into minikube (see README)
          securityContext: { runAsUser: 1000, runAsGroup: 0 }
          envFrom:
            - configMapRef: { name: frappe-config }
          args:
            - bash
            - -c
            - |
              set -e
              ls -1 apps > sites/apps.txt
              [ -f sites/common_site_config.json ] || echo '{}' > sites/common_site_config.json
              bench set-config -g  db_host        "$DB_HOST"
              bench set-config -gp db_port        "$DB_PORT"
              bench set-config -g  redis_cache    "redis://$REDIS_CACHE"
              bench set-config -g  redis_queue    "redis://$REDIS_QUEUE"
              bench set-config -g  redis_socketio "redis://$REDIS_QUEUE"
              bench set-config -gp socketio_port  "$SOCKETIO_PORT"
              # realtime: socket.io verifies logins at http://backend:8000, not the browser's URL
              bench set-config -g  webserver_host "$BACKEND_HOST"
              bench set-config -gp webserver_port "$BACKEND_PORT"
              # full links Frappe generates (emails, redirects) use the port you browse on
              bench set-config -gp http_port      "$PUBLIC_HTTP_PORT"
              echo "apps.txt:"; cat sites/apps.txt
              cat sites/common_site_config.json
          volumeMounts:
            - { name: sites, mountPath: /home/frappe/frappe-bench/sites }
            - { name: logs, mountPath: /home/frappe/frappe-bench/logs }
      volumes:
        - name: sites
          persistentVolumeClaim: { claimName: sites }
        - name: logs
          persistentVolumeClaim: { claimName: logs }
