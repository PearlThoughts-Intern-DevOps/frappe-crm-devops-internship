# Secrets hold sensitive values. `stringData` lets us write plain text;
# Kubernetes stores it base64-encoded (encoded, NOT encrypted).
#
# WARNING: these are throwaway LOCAL-DEV passwords (same as docker/docker-compose.yml).
# For anything real, delete this file and create the secret from the CLI instead:
#   kubectl -n frappe-crm create secret generic frappe-secrets \
#     --from-literal=DB_ROOT_PASSWORD='<strong>' --from-literal=ADMIN_PASSWORD='<strong>'
apiVersion: v1
kind: Secret
metadata:
  name: frappe-secrets
  namespace: frappe-crm
type: Opaque
stringData:
  DB_ROOT_PASSWORD: "123"
  ADMIN_PASSWORD: "admin"
