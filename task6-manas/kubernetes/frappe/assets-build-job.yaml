apiVersion: batch/v1
kind: Job
metadata:
  name: frappe-assets-build
  namespace: frappe-crm
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
      containers:
        - name: assets-build
          image: frappe/bench:v5.28.0
          workingDir: /workspace/frappe-bench
          command:
            - bash
            - -lc
            - bench build
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: frappe-data
              mountPath: /workspace
      volumes:
        - name: frappe-data
          persistentVolumeClaim:
            claimName: frappe-pvc
