
name: DevSecOps Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - "task-*"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create reports directory
        run: mkdir -p reports

      - name: Trivy - Scan dependencies
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          output: reports/dependencies.txt
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Trivy - Scan Docker image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ghcr.io/frappe/crm:stable
          scanners: vuln
          format: table
          output: reports/docker-image.txt
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Gitleaks - Scan secrets
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov - Scan configurations
        id: checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,kubernetes,docker_compose
          output_format: cli

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frappe-security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7
